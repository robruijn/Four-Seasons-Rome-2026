# Controleert programma.json en bouwt de app bij elke push en pull request.
name: Controle
on:
  push:
    branches-ignore: [main]
  pull_request:
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
