# Bouwt de app en zet hem op GitHub Pages bij elke push naar main
# (bijv. als de organisator programma.json via de GitHub-website aanpast).
name: Publiceren
on:
  push:
    # De standaardbranch van de repository mag naar Pages publiceren.
    branches: [main, claude/new-session-auwo2u]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm run build draait eerst de controle van programma.json; bij fouten stopt de publicatie.
      - run: npm run build
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ vars.VITE_GOOGLE_MAPS_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ vars.VITE_GOOGLE_MAP_ID }}
          VITE_GROEPSCODE_HASH: ${{ vars.VITE_GROEPSCODE_HASH }}
      # Zet GitHub Pages aan als dat nog niet gebeurd is (bron: GitHub Actions).
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
