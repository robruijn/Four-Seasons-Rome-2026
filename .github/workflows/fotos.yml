# Handmatig te starten (tab Actions > "Foto's ophalen" > Run workflow),
# of automatisch zodra scripts/fotos-keuze.json wordt aangepast.
# Haalt vrij gelicentieerde foto's op van Wikimedia Commons en commit ze naar de gekozen branch.
name: Foto's ophalen
on:
  push:
    paths: ['scripts/fotos-keuze.json']
  workflow_dispatch:
    inputs:
      opties:
        description: "Leeg = alleen ontbrekende foto's; '--alles' = alles opnieuw; of locatie-id's (bijv. 'colosseo trevi')"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fotos -- ${{ github.event.inputs.opties || '' }}
      - name: Commit foto's
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fotos scripts/.fotos-stand.json
          git diff --cached --quiet && echo "Geen nieuwe foto's" && exit 0
          git commit -m "Foto's bijgewerkt via Wikimedia Commons"
          git push
